<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>VAYUTA Admin</title><style>:root{--paper:#f6f4ef;--ink:#111;--muted:#716f69;--line:rgba(17,17,17,.16);--accent:#ec6a46}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Arial,sans-serif}button,input,select{font:inherit}.shell{max-width:1200px;margin:auto;padding:30px 24px}.mono{font:12px/1.4 monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}h1,h2{font-weight:700;letter-spacing:-.07em;line-height:.95}h1{font-size:clamp(42px,7vw,86px);margin:24px 0 36px}h2{font-size:28px;margin:0 0 18px}.panel{border:1px solid var(--ink);padding:28px;background:#fff}.login{max-width:470px;margin:13vh auto}.field{margin:14px 0}.field label{display:block;font:11px monospace;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);background:var(--paper)}button{border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:999px;cursor:pointer}.ghost{background:transparent;color:var(--ink)}.error{color:#9e3636;min-height:24px}.top{display:flex;align-items:end;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:28px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:28px}.stat{background:#fff;padding:20px}.stat b{display:block;font-size:28px;letter-spacing:-.06em}.stat span{font:11px monospace;text-transform:uppercase;color:var(--muted)}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:24px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:12px 8px;white-space:nowrap}th{font:11px monospace;text-transform:uppercase;color:var(--muted)}td small{display:block;color:var(--muted)}.status{padding:7px 9px;border:1px solid var(--line);background:var(--paper);font-size:12px}.request{padding:13px 0;border-bottom:1px solid var(--line)}.request p{margin:5px 0;color:var(--muted)}.hidden{display:none!important}@media(max-width:760px){.shell{padding:20px 14px}.top{display:block}.top button{margin-top:18px}.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.panel{padding:18px}th,td{font-size:12px}}
</style></head><body><main class="shell"><section id="loginView" class="panel login"><span class="mono">VAYUTA / private operations</span><h1>Admin<br>dashboard.</h1><form id="loginForm"><div class="field"><label for="adminEmail">email</label><input id="adminEmail" type="email" value="admin@vayuta.com" required></div><div class="field"><label for="adminPassword">password</label><input id="adminPassword" type="password" required></div><p id="loginError" class="error"></p><button type="submit">Enter dashboard ↗</button></form></section><section id="dashboardView" class="hidden"><div class="top"><div><span class="mono">VAYUTA / private operations</span><h1>Keep the circle<br>moving.</h1></div><button id="logout" class="ghost">Log out</button></div><div class="stats"><div class="stat"><b id="statOrders">—</b><span>orders</span></div><div class="stat"><b id="statRevenue">—</b><span>paid revenue</span></div><div class="stat"><b id="statPending">—</b><span>awaiting payment</span></div><div class="stat"><b id="statInquiries">—</b><span>messages</span></div></div><div class="grid"><section class="panel"><span class="mono">latest orders</span><h2>Order desk</h2><div class="table-wrap"><table><thead><tr><th>order</th><th>customer</th><th>total</th><th>status</th><th>created</th></tr></thead><tbody id="ordersBody"></tbody></table></div></section><section class="panel"><span class="mono">inbox</span><h2>Requests</h2><div id="requests"></div></section></div></section></main><script>const $=s=>document.querySelector(s),fmt=n=>'₹'+Number(n).toLocaleString('en-IN');async function api(url,opts){const r=await fetch(url,opts);const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');return d}async function load(){try{const summary=await api('/api/admin/summary');$('#loginView').classList.add('hidden');$('#dashboardView').classList.remove('hidden');$('#statOrders').textContent=summary.stats.orders;$('#statRevenue').textContent=fmt(summary.stats.revenue);$('#statPending').textContent=summary.stats.pending;$('#statInquiries').textContent=summary.stats.inquiries;const orders=await api('/api/admin/orders');$('#ordersBody').innerHTML=orders.orders.length?orders.orders.map(o=>`<tr><td><b>${o.id.slice(-8)}</b><small>${o.variant||''} · ${o.color||''}</small></td><td>${o.customer_name}<small>${o.email}</small></td><td>${fmt(o.total_inr)}</td><td><select class="status" data-id="${o.id}">${['pending_payment','paid','payment_review','payment_failed','packing','shipped','delivered','cancelled'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td><td>${new Date(o.created_at).toLocaleDateString()}</td></tr>`).join(''):'<tr><td colspan="5">No orders yet.</td></tr>';document.querySelectorAll('.status').forEach(s=>s.onchange=async()=>{await api('/api/admin/order-status',{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({orderId:s.dataset.id,status:s.value})})});const requests=await api('/api/admin/requests');$('#requests').innerHTML=requests.requests.length?requests.requests.map(r=>`<div class="request"><b>${r.type}</b><small>${r.name||''} · ${r.email}</small><p>${r.brief||r.project||''}</p></div>`).join(''):'<p>No messages yet.</p>'}catch(e){if(!$('#dashboardView').classList.contains('hidden'))alert(e.message)}}$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginError').textContent='';try{await api('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:$('#adminEmail').value,password:$('#adminPassword').value})});await load()}catch(err){$('#loginError').textContent=err.message}};$('#logout').onclick=async()=>{await api('/api/admin/logout',{method:'POST'});location.reload()};load();</script></body></html>
